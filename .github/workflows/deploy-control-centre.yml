name: Deploy HypeTV Control Centre

on:
  push:
    branches: [main]
    paths:
      - 'control-centre/**'
      - '.github/workflows/deploy-control-centre.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hypetv-control-centre-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-centre
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 4779b18dd46417ca4d871f25f0141299

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare deployment token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN GitHub secret is missing."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: control-centre/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply HYPETV_DB --remote

      - name: Deploy Worker and admin assets
        run: npx wrangler deploy
